name: MarginGuard
options:
  bundleIdPrefix: com.usama.marginguard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_PREPROCESS: NO

targets:
  MarginGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MarginGuard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usama.marginguard.app
        INFOPLIST_FILE: MarginGuard/Info.plist
        CODE_SIGN_ENTITLEMENTS: MarginGuard/MarginGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MarginGuardWidgetExtension
        embed: true

  MarginGuardWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MarginGuardWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usama.marginguard.app.widget
        INFOPLIST_FILE: MarginGuardWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MarginGuardWidget/MarginGuardWidget.entitlements
